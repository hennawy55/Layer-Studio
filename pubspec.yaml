name: layer_studio
description: Offline-first non-destructive image composition editor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  flutter_svg: ^2.3.0
  gal: ^3.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  image: ^4.13.1
  uuid: ^4.5.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/licenses/
    - assets/samples/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo.ttf
          weight: 400
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai.ttf
          weight: 400
    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria.ttf
          weight: 400
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri.ttf
          weight: 400
    - family: Changa
      fonts:
        - asset: assets/fonts/changa.ttf
          weight: 400
    - family: Fustat
      fonts:
        - asset: assets/fonts/fustat.ttf
          weight: 400
    - family: Mada
      fonts:
        - asset: assets/fonts/mada.ttf
          weight: 400
    - family: Harmattan
      fonts:
        - asset: assets/fonts/harmattan.ttf
          weight: 400
    - family: Kufam
      fonts:
        - asset: assets/fonts/kufam.ttf
          weight: 400
    - family: Marhey
      fonts:
        - asset: assets/fonts/marhey.ttf
          weight: 400
    - family: Oi
      fonts:
        - asset: assets/fonts/oi.ttf
          weight: 400
    - family: Rakkas
      fonts:
        - asset: assets/fonts/rakkas.ttf
          weight: 400
    - family: Open Sans
      fonts:
        - asset: assets/fonts/opensans.ttf
          weight: 400
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat.ttf
          weight: 400
    - family: Oswald
