name: layer_studio
description: Offline-first non-destructive image composition editor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  image: ^4.5.3
  flutter_svg: ^2.0.17
  archive: ^4.0.2
  uuid: ^4.5.1
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/samples/
