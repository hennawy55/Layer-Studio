name: Build Layer Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Windows runner projects
        run: flutter create --platforms=android,windows --project-name=layer_studio --org=com.layerstudio --no-pub .
      - name: Download licensed bundled fonts
        run: bash tool/fetch_fonts.sh
      - run: flutter pub get
      - name: Prepare Android app and plugin modules for API 36
        run: python3 tool/prepare_android.py
      - name: Format Dart source
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner project
        run: flutter create --platforms=android --project-name=layer_studio --org=com.layerstudio --no-pub .
      - name: Download licensed bundled fonts
        run: bash tool/fetch_fonts.sh
      - name: Install Android API 36 platform
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - run: flutter pub get
      - name: Prepare Android app and plugin modules for API 36
        run: python3 tool/prepare_android.py
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: layer-studio-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows application and Setup
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop and generate runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=layer_studio --org=com.layerstudio --no-pub .
      - name: Download licensed bundled fonts
        shell: pwsh
        run: ./tool/fetch_fonts.ps1
      - name: Format and resolve dependencies
        shell: pwsh
        run: |
          dart format lib test
          flutter pub get
      - run: flutter build windows --release
      - name: Package Windows application folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Layer-Studio-Windows-x64.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LayerStudio.iss
      - uses: actions/upload-artifact@v4
        with:
          name: layer-studio-windows-x64
          path: Layer-Studio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: layer-studio-windows-installer
          path: dist/Layer-Studio-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/layer-studio-android-apk/app-release.apk
            release-files/layer-studio-windows-x64/Layer-Studio-Windows-x64.zip
            release-files/layer-studio-windows-installer/Layer-Studio-Setup-x64.exe
